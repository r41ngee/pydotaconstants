name: check&update

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: update-constants
    cancel-in-progress: false

jobs:
    check:
        name: Check for d2vpkr changes
        runs-on: ubuntu-latest
        outputs:
            proceed: ${{ steps.check.outputs.proceed }}
            latest: ${{ steps.check.outputs.latest }}
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v5
            - name: Check d2vpkr for new commits
              id: check
              run: |
                    set -euo pipefail
                    latest=$(gh api repos/dotabuff/d2vpkr/commits/master --jq .sha)
                    current=$(cat d2vpkr_commit.sha 2>/dev/null || echo "")

                    echo "latest=$latest" >> "$GITHUB_OUTPUT"
                    if [[ "$latest" != "$current" ]]; then
                        echo "proceed=true" >> "$GITHUB_OUTPUT"
                        echo "d2vpkr changed: $current -> $latest"
                    else
                        echo "proceed=false" >> "$GITHUB_OUTPUT"
                        echo "No d2vpkr changes since $current; nothing to do."
                    fi

    update:
        name: Rebuild constants
        runs-on: ubuntu-latest
        needs: check
        if: needs.check.outputs.proceed == 'true'
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            changes: ${{ steps.push.outputs.changes }}
        steps:
            - uses: actions/checkout@v5
            - name: Download VDF files from d2vpkr
              run: |
                    set -euo pipefail
                    mkdir -p src/pydotaconstants/source_vdf/abilities
                    mkdir -p src/pydotaconstants/source_vdf/locals

                    BASE="https://raw.githubusercontent.com/dotabuff/d2vpkr/master/dota"

                    curl -sL -o src/pydotaconstants/source_vdf/npc_heroes.txt \
                        "$BASE/scripts/npc/npc_heroes.txt"
                    curl -sL -o src/pydotaconstants/source_vdf/items.txt \
                        "$BASE/scripts/npc/items.txt"

                    curl -sL -o src/pydotaconstants/source_vdf/locals/abilities_english.txt \
                        "$BASE/resource/localization/abilities_english.txt"
                    curl -sL -o src/pydotaconstants/source_vdf/locals/dota_english.txt \
                        "$BASE/resource/localization/dota_english.txt"

                    gh api repos/dotabuff/d2vpkr/contents/dota/scripts/npc/heroes \
                        | jq -r '.[].download_url' \
                        | while read -r url; do
                            name=$(basename "$url")
                            curl -sL -o "src/pydotaconstants/source_vdf/abilities/$name" "$url"
                        done
            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - name: Install dependencies
              run: uv sync
            - name: Run update script
              run: uv run python src/pydotaconstants/_update.py
            - name: Validate build output
              run: |
                    set -euo pipefail
                    heroes=$(jq 'length' src/pydotaconstants/data/heroes.json)
                    items=$(jq 'length' src/pydotaconstants/data/items.json)
                    abilities=$(jq 'length' src/pydotaconstants/data/abilities.json)
                    echo "heroes=$heroes items=$items abilities=$abilities"
                    if (( heroes < 120 || items < 500 || abilities < 1000 )); then
                        echo "::error::Build output looks incomplete (heroes=$heroes items=$items abilities=$abilities)"
                        exit 1
                    fi
            - name: Commit and push if constants changed
              id: push
              env:
                  LATEST: ${{ needs.check.outputs.latest }}
              run: |
                    set -euo pipefail
                    git config user.name  'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                    if git diff --quiet src/pydotaconstants/data/; then
                        echo "No constant changes. Advancing d2vpkr tracker only."
                        echo "$LATEST" > d2vpkr_commit.sha
                        if ! git diff --quiet -- d2vpkr_commit.sha; then
                            git add d2vpkr_commit.sha
                            git commit -m "chore: track d2vpkr ${LATEST} (no constant changes)"
                            git push
                        fi
                        echo "changes=false" >> $GITHUB_OUTPUT
                        exit 0
                    fi

                    echo "$LATEST" > d2vpkr_commit.sha
                    uv version --bump post

                    PATCH = $(curl https://www.dota2.com/datafeed/patchnoteslist | jq ".patches[-1].patch_name" --raw-output)
                    echo "$PATCH" > current_patch.md

                    git add -A
                    git commit -m "patch(${PATCH}): update constants from d2vpkr ${LATEST}"
                    git push
                    echo "changes=true" >> $GITHUB_OUTPUT

    publish:
        needs: update
        runs-on: ubuntu-latest
        if: needs.update.outputs.changes == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - run: uv publish --token ${{ secrets.PYPI_TOKEN }}

    report:
        name: Report
        runs-on: ubuntu-latest
        needs: [check, update]
        if: always()
        steps:
            - name: Summarize
              run: |
                    if [ "${{ needs.check.outputs.proceed }}" != "true" ]; then
                        echo "## ✅ No updates needed" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "d2vpkr is already at \`${{ needs.check.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
                    elif [ "${{ needs.update.result }}" = "success" ]; then
                        echo "## 🔄 Constants updated" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "Updated from d2vpkr \`${{ needs.check.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
                    else
                        echo "## ❌ Update failed" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "The update job finished with status: \`${{ needs.update.result }}\`" >> $GITHUB_STEP_SUMMARY
                        exit 1
                    fi
