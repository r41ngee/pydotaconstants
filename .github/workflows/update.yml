name: Update Dota 2 constants

on:
    workflow_call:
    workflow_dispatch:
    schedule:
        - cron: "30 */2 * * *"
          timezone: "Europe/Moscow"
        - cron: "30 0-4,22-23 * * MON-FRI"
          timezone: "Europe/Moscow"
    issues:
        types: [opened, labeled]
    issue_comment:
        types: [created]

permissions:
    contents: write

concurrency:
    group: update-constants
    cancel-in-progress: false

jobs:
    check:
        name: Check for d2vpkr changes
        runs-on: ubuntu-latest
        outputs:
            proceed: ${{ steps.check.outputs.proceed }}
            latest: ${{ steps.check.outputs.latest }}
        if: |
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_call' ||
            github.event_name == 'push' ||
            (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'outdated-data')) ||
            (github.event_name == 'issue_comment' && github.event.comment.body == '/update')
        steps:
            - uses: actions/checkout@v5
            - name: Check d2vpkr for new commits
              id: check
              run: |
                    set -euo pipefail
                    latest=$(curl -sSf --retry 3 \
                        -H "Accept: application/vnd.github+json" \
                        'https://api.github.com/repos/dotabuff/d2vpkr/commits/master' \
                        | jq -r .sha)
                    current=$(cat d2vpkr_commit.sha 2>/dev/null || echo "")

                    echo "latest=$latest" >> "$GITHUB_OUTPUT"
                    if [[ "$latest" != "$current" ]]; then
                        echo "proceed=true" >> "$GITHUB_OUTPUT"
                        echo "d2vpkr changed: $current -> $latest"
                    else
                        echo "proceed=false" >> "$GITHUB_OUTPUT"
                        echo "No d2vpkr changes since $current; nothing to do."
                    fi

    update:
        name: Rebuild constants
        runs-on: ubuntu-latest
        needs: check
        if: needs.check.outputs.proceed == 'true'
        steps:
            - uses: actions/checkout@v5
            - name: Download VDF files from d2vpkr
              run: |
                    set -euo pipefail
                    mkdir -p src/pydotaconstants/source_vdf/abilities
                    mkdir -p src/pydotaconstants/source_vdf/locals

                    BASE="https://raw.githubusercontent.com/dotabuff/d2vpkr/master/dota"

                    curl -sL -o src/pydotaconstants/source_vdf/npc_heroes.txt \
                        "$BASE/scripts/npc/npc_heroes.txt"
                    curl -sL -o src/pydotaconstants/source_vdf/items.txt \
                        "$BASE/scripts/npc/items.txt"

                    curl -sL -o src/pydotaconstants/source_vdf/locals/abilities_english.txt \
                        "$BASE/resource/localization/abilities_english.txt"
                    curl -sL -o src/pydotaconstants/source_vdf/locals/dota_english.txt \
                        "$BASE/resource/localization/dota_english.txt"

                    curl -sL 'https://api.github.com/repos/dotabuff/d2vpkr/contents/dota/scripts/npc/heroes' \
                        | jq -r '.[].download_url' \
                        | while read -r url; do
                            name=$(basename "$url")
                            curl -sL -o "src/pydotaconstants/source_vdf/abilities/$name" "$url"
                        done
            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - name: Install dependencies
              run: uv sync
            - name: Run update script
              run: uv run python src/pydotaconstants/_update.py
            - name: Validate build output
              run: |
                    set -euo pipefail
                    heroes=$(jq 'length' src/pydotaconstants/data/heroes.json)
                    items=$(jq 'length' src/pydotaconstants/data/items.json)
                    abilities=$(jq 'length' src/pydotaconstants/data/abilities.json)
                    echo "heroes=$heroes items=$items abilities=$abilities"
                    if (( heroes < 120 || items < 100 || abilities < 1000 )); then
                        echo "::error::Build output looks incomplete (heroes=$heroes items=$items abilities=$abilities)"
                        exit 1
                    fi
            - name: Commit and push if constants changed
              env:
                  LATEST: ${{ needs.check.outputs.latest }}
              run: |
                    set -euo pipefail
                    git config user.name  'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                    if git diff --quiet src/pydotaconstants/data/; then
                        echo "No constant changes. Advancing d2vpkr tracker only."
                        echo "$LATEST" > d2vpkr_commit.sha
                        if ! git diff --quiet -- d2vpkr_commit.sha; then
                            git add d2vpkr_commit.sha
                            git commit -m "chore: track d2vpkr ${LATEST} (no constant changes)"
                            git push
                        fi
                            exit 0
                        fi

                        echo "$LATEST" > d2vpkr_commit.sha
                        git add -A
                        git commit -m "Update constants from d2vpkr ${LATEST}"
                        git push
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                    name: pydotaconstants-build
                    path: .

    pypi:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        needs: update
        if: needs.update.result == 'success' && github.event_name != 'workflow_dispatch'
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v7
              with:
                    name: pydotaconstants-build
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync
            
            - name: Bump version
              run: uv version --bump post
            
            - name: Build library
              run: uv build

            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                    user: __token__
                    password: ${{ secrets.PYPI_API_TOKEN }}