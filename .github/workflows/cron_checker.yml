on:
  schedule:
    - cron: "30 */2 * * *"
      timezone: "Europe/Moscow"
    - cron: "30 0-4,22-23 * * MON-FRI"
      timezone: "Europe/Moscow"
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  check-update:
    name: Check & update
    uses: ./.github/workflows/update.yml

  
  update-pages:
    needs: check-update
    if: needs.check-update.proceeds == 'true' || needs.check-update.outputs.data_updated == 'true'
    uses: ./.github/workflows/pages.yml
