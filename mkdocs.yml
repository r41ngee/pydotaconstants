site_name: PyDotaConstants
site_url: https://r41ngee.github.io/pydotaconstants/
repo_url: https://github.com/r41ngee/pydotaconstants
repo_name: r41ngee/pydotaconstants

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - API Reference:
    - Heroes: api/heroes.md
    - Abilities: api/abilities.md
    - Items: api/items.md
  - Data Browser:
    - Heroes: data/heroes.html
    - Abilities: data/abilities.html
    - Items: data/items.html

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css
