<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abilities Browser — PyDotaConstants</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--md-text-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
            color: var(--md-default-fg-color, #333);
            background: var(--md-bg-color, #fff);
            padding: 24px; max-width: 1200px; margin: 0 auto;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        input[type="text"] {
            flex: 1; min-width: 200px; padding: 8px 14px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 0.95rem;
            background: var(--md-code-bg-color, #f5f5f5); color: var(--md-default-fg-color, #333);
        }
        input[type="text"]:focus { outline: none; border-color: #7b1fa2; }
        .count { font-size: 0.9rem; color: #888; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
        .card {
            border: 1px solid var(--md-default-fg-color--lightest, #e0e0e0);
            border-radius: 10px; padding: 16px; cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .card-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .card-codename { font-size: 0.82rem; color: #999; margin-bottom: 6px; }
        .card-desc { font-size: 0.85rem; color: #666; line-height: 1.4; }
        .stat-row { display: flex; gap: 12px; margin-top: 8px; font-size: 0.82rem; color: #888; }
        .stat { background: var(--md-code-bg-color, #f5f5f5); padding: 2px 8px; border-radius: 4px; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--md-code-bg-color, #fff); border-radius: 12px; padding: 24px;
            max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px; font-size: 1.5rem;
            cursor: pointer; background: none; border: none; color: var(--md-default-fg-color, #333);
        }
        .modal-content h2 { margin-bottom: 4px; }
        .modal-content .modal-sub { color: #888; font-size: 0.85rem; margin-bottom: 12px; }
        .json-view {
            background: var(--md-bg-color, #f5f5f5); border-radius: 8px; padding: 16px;
            overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word;
        }
        .empty { text-align: center; padding: 48px; color: #999; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>Abilities</h1>
    <p class="subtitle">Browse all Dota 2 abilities from pydotaconstants data</p>
    <div class="controls">
        <input type="text" id="search" placeholder="Search by name or codename...">
        <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No abilities match your search.</div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 id="modal-title"></h2>
            <div class="modal-sub" id="modal-sub"></div>
            <div class="json-view" id="modal-json"></div>
        </div>
    </div>

    <script>
    (async () => {
        const [abilRes, localsRes] = await Promise.all([
            fetch('./abilities.json'),
            fetch('./locals.json')
        ]);
        const rawAbilities = await abilRes.json();
        const locals = await localsRes.json();

        const abilities = Object.entries(rawAbilities).map(([key, data]) => ({
            codename: key,
            displayName: locals[key] || key,
            description: (locals[key + '_Description'] || '').replace(/<[^>]+>/g, ''),
            cooldown: data.AbilityCooldown || '—',
            manaCost: data.AbilityManaCost || '—',
            behavior: data.AbilityBehavior || '',
            data
        })).sort((a, b) => a.displayName.localeCompare(b.displayName));

        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const countEl = document.getElementById('count');
        const searchInput = document.getElementById('search');

        function render() {
            const q = searchInput.value.toLowerCase();
            const filtered = abilities.filter(a => {
                if (q && !a.displayName.toLowerCase().includes(q) && !a.codename.includes(q)) return false;
                return true;
            });
            countEl.textContent = `${filtered.length} / ${abilities.length}`;
            if (filtered.length === 0) { grid.innerHTML = ''; empty.style.display = ''; return; }
            empty.style.display = 'none';
            grid.innerHTML = filtered.map(a => `
                <div class="card" data-codename="${a.codename}">
                    <div class="card-name">${a.displayName}</div>
                    <div class="card-codename">${a.codename}</div>
                    <div class="card-desc">${a.description.substring(0, 120)}${a.description.length > 120 ? '…' : ''}</div>
                    <div class="stat-row">
                        <span class="stat">CD: ${a.cooldown}</span>
                        <span class="stat">Mana: ${a.manaCost}</span>
                    </div>
                </div>
            `).join('');
            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const a = abilities.find(x => x.codename === card.dataset.codename);
                    document.getElementById('modal-title').textContent = a.displayName;
                    document.getElementById('modal-sub').textContent = a.codename;
                    document.getElementById('modal-json').textContent = JSON.stringify(a.data, null, 2);
                    document.getElementById('modal').classList.add('active');
                });
            });
        }

        document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal').classList.remove('active'));
        document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.target.classList.remove('active'); });
        searchInput.addEventListener('input', render);
        render();
    })();
    </script>
</body>
</html>
