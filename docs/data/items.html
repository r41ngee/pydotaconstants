<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Browser — PyDotaConstants</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--md-text-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
            color: var(--md-default-fg-color, #333);
            background: var(--md-bg-color, #fff);
            padding: 24px; max-width: 1200px; margin: 0 auto;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        input[type="text"] {
            flex: 1; min-width: 200px; padding: 8px 14px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 0.95rem;
            background: var(--md-code-bg-color, #f5f5f5); color: var(--md-default-fg-color, #333);
        }
        input[type="text"]:focus { outline: none; border-color: #7b1fa2; }
        select {
            padding: 8px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 0.95rem;
            background: var(--md-code-bg-color, #f5f5f5); color: var(--md-default-fg-color, #333);
        }
        select:focus { outline: none; border-color: #7b1fa2; }
        .count { font-size: 0.9rem; color: #888; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
        .card {
            border: 1px solid var(--md-default-fg-color--lightest, #e0e0e0);
            border-radius: 10px; padding: 16px; cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .card-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .card-codename { font-size: 0.82rem; color: #999; margin-bottom: 6px; }
        .card-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .tag {
            background: var(--md-code-bg-color, #f5f5f5); padding: 2px 8px;
            border-radius: 4px; font-size: 0.78rem; color: #666;
        }
        .tag-cost { background: #fff3e0; color: #e65100; font-weight: 600; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--md-code-bg-color, #fff); border-radius: 12px; padding: 24px;
            max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px; font-size: 1.5rem;
            cursor: pointer; background: none; border: none; color: var(--md-default-fg-color, #333);
        }
        .modal-content h2 { margin-bottom: 4px; }
        .modal-content .modal-sub { color: #888; font-size: 0.85rem; margin-bottom: 12px; }
        .json-view {
            background: var(--md-bg-color, #f5f5f5); border-radius: 8px; padding: 16px;
            overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word;
        }
        .empty { text-align: center; padding: 48px; color: #999; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>Items</h1>
    <p class="subtitle">Browse all Dota 2 items from pydotaconstants data</p>
    <div class="controls">
        <input type="text" id="search" placeholder="Search by name or codename...">
        <select id="quality-filter"><option value="">All qualities</option></select>
        <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No items match your search.</div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 id="modal-title"></h2>
            <div class="modal-sub" id="modal-sub"></div>
            <div class="json-view" id="modal-json"></div>
        </div>
    </div>

    <script>
    (async () => {
        const [itemRes, localsRes] = await Promise.all([
            fetch('./items.json'),
            fetch('./locals.json')
        ]);
        const rawItems = await itemRes.json();
        const locals = await localsRes.json();

        const items = Object.entries(rawItems).map(([key, data]) => ({
            codename: key,
            displayName: locals[key] || key,
            cost: parseInt(data.ItemCost || 0),
            quality: data.ItemQuality || '',
            cooldown: data.AbilityCooldown || '—',
            manaCost: data.AbilityManaCost || '—',
            data
        })).sort((a, b) => a.displayName.localeCompare(b.displayName));

        const qualities = [...new Set(items.map(i => i.quality).filter(Boolean))].sort();
        const qualitySelect = document.getElementById('quality-filter');
        qualities.forEach(q => { const o = document.createElement('option'); o.value = q; o.textContent = q; qualitySelect.appendChild(o); });

        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const countEl = document.getElementById('count');
        const searchInput = document.getElementById('search');

        function render() {
            const q = searchInput.value.toLowerCase();
            const quality = qualitySelect.value;
            const filtered = items.filter(i => {
                if (q && !i.displayName.toLowerCase().includes(q) && !i.codename.includes(q)) return false;
                if (quality && i.quality !== quality) return false;
                return true;
            });
            countEl.textContent = `${filtered.length} / ${items.length}`;
            if (filtered.length === 0) { grid.innerHTML = ''; empty.style.display = ''; return; }
            empty.style.display = 'none';
            grid.innerHTML = filtered.map(i => `
                <div class="card" data-codename="${i.codename}">
                    <div class="card-name">${i.displayName}</div>
                    <div class="card-codename">${i.codename}</div>
                    <div class="card-meta">
                        ${i.cost ? `<span class="tag tag-cost">${i.cost}g</span>` : ''}
                        ${i.quality ? `<span class="tag">${i.quality}</span>` : ''}
                        <span class="tag">CD: ${i.cooldown}</span>
                    </div>
                </div>
            `).join('');
            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const i = items.find(x => x.codename === card.dataset.codename);
                    document.getElementById('modal-title').textContent = i.displayName;
                    document.getElementById('modal-sub').textContent = i.codename;
                    document.getElementById('modal-json').textContent = JSON.stringify(i.data, null, 2);
                    document.getElementById('modal').classList.add('active');
                });
            });
        }

        document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal').classList.remove('active'));
        document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.target.classList.remove('active'); });
        searchInput.addEventListener('input', render);
        qualitySelect.addEventListener('change', render);
        render();
    })();
    </script>
</body>
</html>
